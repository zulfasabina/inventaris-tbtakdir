<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Inventaris TB Takdir (Prototipe UTS)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="dashboard.html"><i class="bi bi-box-seam"></i> Inventaris TB Takdir</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Menu"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="nav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link " href="barang.html">Data Barang</a></li>
            </ul>
            <span class="navbar-text me-3"><i class="bi bi-person-circle"></i> Pemilik Toko <span class="badge bg-light text-primary">admin</span></span>
            <a class="btn btn-outline-light btn-sm" href="login.html"><i class="bi bi-box-arrow-right"></i> Keluar</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1 class="h4 mb-3">Dashboard</h1>
    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card stat border-0 shadow-sm"><div class="card-body"><div class="text-muted small">Jenis Barang</div><div class="fs-2 fw-bold" id="statBarang"></div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card stat border-0 shadow-sm"><div class="card-body"><div class="text-muted small">Kategori</div><div class="fs-2 fw-bold" id="statKategori"></div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card stat border-0 shadow-sm"><div class="card-body"><div class="text-muted small">Lokasi Simpan</div><div class="fs-2 fw-bold" id="statLokasi"></div></div></div></div>
        <div class="col-6 col-lg-3"><div class="card stat border-0 shadow-sm border-start border-danger border-4"><div class="card-body"><div class="text-muted small">Stok Menipis</div><div class="fs-2 fw-bold text-danger" id="statMenipis"></div></div></div></div>
    </div>
    <div class="row g-3">
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">Stok Menipis</div>
                <div class="table-responsive"><table class="table table-sm mb-0 align-middle">
                    <thead><tr><th>Barang</th><th>Lokasi</th><th class="text-end">Stok</th><th class="text-end">Min.</th></tr></thead>
                    <tbody id="tbMenipis"></tbody></table></div>
            </div>
        </div>
        <div class="col-lg-6">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-white fw-semibold">Perubahan Stok Terbaru</div>
                <div class="table-responsive"><table class="table table-sm mb-0 align-middle">
                    <thead><tr><th>Waktu</th><th>Barang</th><th class="text-end">Perubahan</th><th>Oleh</th></tr></thead>
                    <tbody id="tbRiwayat"></tbody></table></div>
            </div>
        </div>
    </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/dummy.js"></script>
<script>
    $(function () {
        $('#statBarang').text(DUMMY_BARANG.length);
        $('#statKategori').text(DUMMY_KATEGORI.length);
        $('#statLokasi').text(DUMMY_LOKASI.length);
        const low = DUMMY_BARANG.filter(menipis);
        $('#statMenipis').text(low.length);
        low.forEach(function (b) {
            $('#tbMenipis').append('<tr><td>' + esc(b.nama) + '<br><small class="text-muted">' + esc(b.kode) + '</small></td><td>' + esc(b.lokasi) +
                '</td><td class="text-end"><span class="badge bg-danger">' + b.stok + ' ' + esc(b.satuan) + '</span></td><td class="text-end">' + b.min + '</td></tr>');
        });
        DUMMY_RIWAYAT.forEach(function (r) {
            const cls = r.perubahan > 0 ? 'success' : 'danger';
            $('#tbRiwayat').append('<tr><td>' + esc(r.waktu) + '</td><td>' + esc(r.barang) + '<br><small class="text-muted">' + esc(r.jenis) +
                '</small></td><td class="text-end"><span class="badge bg-' + cls + '">' + (r.perubahan > 0 ? '+' : '') + r.perubahan + '</span></td><td>' + esc(r.oleh) + '</td></tr>');
        });
    });
</script>
</body>
</html>
